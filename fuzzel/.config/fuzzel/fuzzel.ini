# fuzzel — ~/.config/fuzzel/fuzzel.ini
#
# Colors follow the gruvbox warm palette:
#   bg=#1d2021  surface=#282828  text=#ebdbb2  accent=#fe8019
#   border=#3c3836  muted=#665c54
# fuzzel colors are RRGGBBAA (no leading #).

font=FiraCode Nerd Font:size=12
terminal=foot
prompt="❯ "
dpi-aware=auto
width=40
lines=12
horizontal-pad=16
vertical-pad=10
inner-pad=6
line-height=22

[colors]
background=1d2021ff
text=ebdbb2ff
match=fe8019ff
selection=282828ff
selection-text=ebdbb2ff
selection-match=fe8019ff
border=fe8019ff

[border]
width=2
radius=0

[dmenu]
exit-immediately-if-empty=yes
