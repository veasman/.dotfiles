# hypridle.conf — ~/.config/hypr/hypridle.conf
#
# Idle orchestration. Replaces swayidle on the Hyprland session.
# Locks at 15min, DPMS-off at 30min (no suspend — desktop can't
# wake from S3). Both are inhibited while any window is fullscreen
# or gamemode is active, so games/video don't trigger timeouts.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 900
    on-timeout = hypridle-action lock
}

listener {
    timeout = 1800
    on-timeout = hypridle-action dpms-off
    on-resume = hyprctl dispatch dpms on
}
