# hyprland-host.conf — per-hostname overrides (computer)
#
# DP-1's 1440p detection and 1080p downgrade is handled by
# hyprland-output-profile (apply_profile_computer) — no need
# to hardcode connector names here.

exec-once = steam
exec-once = night-light
monitor = HDMI-A-1, 1920x1080@60, auto, 1
