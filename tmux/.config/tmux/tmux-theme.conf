# gruvbox (hard contrast) — statically shipped, no kara-beautify dependency.
#
# window-style / default-style stay at `bg=default,fg=default` so the
# main pane area inherits the terminal's per-mode alpha'd background; if
# this file pinned an opaque hex here, tmux would draw the pane with
# that color and kill the terminal's transparency. This is the #1
# thing that trips up tmux + transparent terminal setups.

set -g window-style "bg=default,fg=default"
set -g window-active-style "bg=default,fg=default"

# Status bar — gruvbox bg_h (#1d2021).
set -g status-style "bg=#1d2021,fg=#ebdbb2"

set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#665c54"

set -g message-style "bg=#d79921,fg=#1d2021"

set -g status-left-style  "bg=#1d2021,fg=#d79921"
set -g status-right-style "bg=#1d2021,fg=#a89984"

set -g window-status-style         "bg=#1d2021,fg=#a89984"
set -g window-status-current-style "bg=#1d2021,fg=#d79921"

set -g mode-style "bg=#d79921,fg=#1d2021"

set -g status-justify left
set -g status-left-length 30
set -g status-right-length 100
